<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ultimate Mess Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        body {
            background: #f1f3f6
        }

        .card {
            border-radius: 15px
        }

        .fc {
            font-size: 12px
        }
    </style>
</head>

<body>

    <div class="container mt-3">

        <h4 class="text-center mb-3">Ultimate Mess Management System</h4>

        <div id="loginBox" class="card p-3">
            <select id="loginUser" class="form-control mb-2"></select>
            <input type="password" id="loginPass" class="form-control mb-2">
            <button class="btn btn-primary w-100" onclick="login()">Login</button>
        </div>

        <div id="app" style="display:none">

            <ul class="nav nav-tabs mb-3">
                <li class="nav-item"><span class="nav-link active" onclick="tab('dashboard')">Dashboard</span></li>
                <li class="nav-item"><span class="nav-link" onclick="tab('calendar')">Calendar</span></li>
                <li class="nav-item"><span class="nav-link" onclick="tab('manager')">Manager</span></li>
                <li class="nav-item"><span class="nav-link" onclick="tab('notice')">Notice</span></li>
                <li class="nav-item"><span class="nav-link" onclick="tab('complain')">Complaint</span></li>
                <li class="nav-item"><span class="nav-link" onclick="tab('data')">Data</span></li>
            </ul>

            <div class="card p-3">

                <div id="dashboardTab"></div>
                <div id="calendarTab" style="display:none">
                    <div id="calendar"></div>
                    <div id="mealForm" class="mt-3"></div>
                </div>
                <div id="managerTab" style="display:none"></div>
                <div id="noticeTab" style="display:none"></div>
                <div id="complainTab" style="display:none"></div>
                <div id="dataTab" style="display:none"></div>

            </div>
        </div>
    </div>

    <script>

        let db = JSON.parse(localStorage.getItem("messUltimate")) || {
            users: [
                { name: "Member1", pass: "123" },
                { name: "Member2", pass: "123" },
                { name: "Member3", pass: "123" },
                { name: "Member4", pass: "123" },
                { name: "Member5", pass: "123" }
            ],
            months: {}
        };

        let currentUser = null;
        let currentMonth = null;

        function save() { localStorage.setItem("messUltimate", JSON.stringify(db)); }

        function loadUsers() {
            loginUser.innerHTML = "";
            db.users.forEach((u, i) => {
                loginUser.innerHTML += `<option value="${i}">${u.name}</option>`;
            });
        }
        loadUsers();

        function login() {
            let i = loginUser.value;
            if (db.users[i].pass === loginPass.value) {
                currentUser = i;
                loginBox.style.display = "none";
                app.style.display = "block";
                init();
            } else alert("Wrong password");
        }

        function tab(t) {
            document.querySelectorAll('[id$="Tab"]').forEach(e => e.style.display = "none");
            document.getElementById(t + "Tab").style.display = "block";
        }

        function init() {
            selectOrCreateMonth();
            renderDashboard();
            renderManager();
            renderNotice();
            renderComplaint();
            renderData();
            renderCalendar();
        }

        function selectOrCreateMonth() {
            let m = new Date().toISOString().slice(0, 7);
            if (!db.months[m]) {
                db.months[m] = {
                    manager: 0,
                    lockTime: "22:00",
                    closed: false,
                    meals: {},
                    expenses: [],
                    deposits: [],
                    notices: [],
                    complaints: []
                };
            }
            currentMonth = m;
            save();
        }

        function getMonth() { return db.months[currentMonth]; }

        function renderDashboard() {
            let m = getMonth();
            let mealCount = Array(db.users.length).fill(0);
            let dateMatrix = {};

            Object.entries(m.meals).forEach(([date, users]) => {
                dateMatrix[date] = Array(db.users.length).fill(0);
                Object.entries(users).forEach(([uid, val]) => {
                    let c = val.b + val.l + val.d + val.g;
                    mealCount[uid] += c;
                    dateMatrix[date][uid] = c;
                });
            });

            let totalMeal = mealCount.reduce((a, b) => a + b, 0);
            let bazar = m.expenses.filter(e => e.type == "bazar").reduce((a, b) => a + b.amount, 0);
            let fixed = m.expenses.filter(e => e.type == "fixed").reduce((a, b) => a + b.amount, 0);
            let rate = totalMeal ? bazar / totalMeal : 0;

            let html = "<h6>Meal Matrix</h6><div class='table-responsive'><table class='table table-bordered'><tr><th>Date</th>";
            db.users.forEach(u => html += `<th>${u.name}</th>`);
            html += "<th>Total</th></tr>";

            Object.entries(dateMatrix).forEach(([date, row]) => {
                let t = row.reduce((a, b) => a + b, 0);
                html += `<tr><td>${date}</td>`;
                row.forEach(c => html += `<td>${c}</td>`);
                html += `<td>${t}</td></tr>`;
            });

            html += "</table></div>";

            html += "<h6>Member Summary</h6><table class='table table-bordered'><tr><th>Name</th><th>Total Meal</th><th>Meal Cost</th><th>Common</th><th>Deposit</th><th>Balance</th></tr>";

            db.users.forEach((u, i) => {
                let mealCost = mealCount[i] * rate;
                let common = fixed / db.users.length;
                let deposit = m.deposits.filter(d => d.uid == i).reduce((a, b) => a + b.amount, 0);
                let totalDue = mealCost + common;
                let balance = deposit - totalDue;
                html += `<tr>
<td>${u.name}</td>
<td>${mealCount[i]}</td>
<td>${mealCost.toFixed(2)}</td>
<td>${common.toFixed(2)}</td>
<td>${deposit}</td>
<td class="${balance < 0 ? 'text-danger' : 'text-success'}">${balance.toFixed(2)}</td>
</tr>`;
            });

            html += "</table>";

            dashboardTab.innerHTML = html;
        }

        function renderCalendar() {
            let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                dateClick: function (info) { openMealForm(info.dateStr); }
            });
            calendar.render();
        }

        function openMealForm(date) {
            let m = getMonth();
            if (m.closed) { mealForm.innerHTML = "<b>Month Closed</b>"; return; }

            let lockNow = new Date().toTimeString().slice(0, 5);
            let locked = lockNow > m.lockTime;

            if (!m.meals[date]) m.meals[date] = {};

            let html = `<h6>Meal Entry: ${date}</h6>`;
            db.users.forEach((u, i) => {
                let v = m.meals[date][i] || { b: 0, l: 0, d: 0, g: 0 };
                html += `
<div class="border p-2 mb-2">
<b>${u.name}</b><br>
B <input type="checkbox" ${v.b ? "checked" : ""} ${locked ? "disabled" : ""} onchange="updateMeal('${date}',${i},'b',this.checked)">
L <input type="checkbox" ${v.l ? "checked" : ""} ${locked ? "disabled" : ""} onchange="updateMeal('${date}',${i},'l',this.checked)">
D <input type="checkbox" ${v.d ? "checked" : ""} ${locked ? "disabled" : ""} onchange="updateMeal('${date}',${i},'d',this.checked)">
G <input type="number" value="${v.g}" ${locked ? "disabled" : ""} onchange="updateGuest('${date}',${i},this.value)">
</div>`;
            });
            if (locked) html += "<div class='text-danger'>Meal Locked</div>";
            mealForm.innerHTML = html;
        }

        function updateMeal(date, i, t, val) {
            let m = getMonth();
            if (!m.meals[date][i]) m.meals[date][i] = { b: 0, l: 0, d: 0, g: 0 };
            m.meals[date][i][t] = val ? 1 : 0;
            save();
            renderDashboard();
        }

        function updateGuest(date, i, val) {
            let m = getMonth();
            if (!m.meals[date][i]) m.meals[date][i] = { b: 0, l: 0, d: 0, g: 0 };
            m.meals[date][i].g = parseInt(val) || 0;
            save();
            renderDashboard();
        }

        function renderManager() {
            let m = getMonth();
            managerTab.innerHTML = `
Lock Time: <input type="time" value="${m.lockTime}" onchange="setLock(this.value)">
<br><br>
<button class="btn btn-danger" onclick="closeMonth()">Close Month</button>
`;
        }

        function setLock(t) { getMonth().lockTime = t; save(); }

        function closeMonth() { getMonth().closed = true; save(); renderDashboard(); }

        function renderNotice() {
            let m = getMonth();
            let html = m.notices.map(n => `<div>${n}</div>`).join("");
            noticeTab.innerHTML = html + `<input id="noticeInput" class="form-control mt-2">
<button class="btn btn-primary mt-2" onclick="addNotice()">Add</button>`;
        }

        function addNotice() { getMonth().notices.push(noticeInput.value); save(); renderNotice(); }

        function renderComplaint() {
            let m = getMonth();
            let html = m.complaints.map(c => `<div>${c}</div>`).join("");
            complainTab.innerHTML = html + `<input id="complainInput" class="form-control mt-2">
<button class="btn btn-danger mt-2" onclick="addComplaint()">Submit</button>`;
        }

        function addComplaint() {
            getMonth().complaints.push(db.users[currentUser].name + " : " + complainInput.value);
            save();
            renderComplaint();
        }

        function renderData() {
            dataTab.innerHTML = `
<button class="btn btn-success" onclick="exportData()">Export JSON</button>
<input type="file" class="form-control mt-2" onchange="importData(event)">
`;
        }

        function exportData() {
            let blob = new Blob([JSON.stringify(db)], { type: "application/json" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mess_backup.json";
            a.click();
        }

        function importData(e) {
            let f = e.target.files[0];
            let r = new FileReader();
            r.onload = function () { db = JSON.parse(r.result); save(); location.reload(); }
            r.readAsText(f);
        }

    </script>
</body>

</html>
